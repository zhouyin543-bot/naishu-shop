/* Layout: a phone-width game column centred on any screen; canvas shop scene fills it (room above, counter, kitchen grid below); DOM HUD on top, a bottom sheet hub between days, modal cards for results */
:root{
  --ink:#3D2C29;
  --ink-soft:#7B6157;
  --paper:#FFF8EA;
  --card:#FFFDF8;
  --line:#EBD9BD;
  --well:#F6EBD6;
  --butter:#F6D85A;
  --cheese:#FFC433;
  --tomato:#F2674B;
  --tomato-press:#D9533A;
  --mint:#3FB28A;
  --mint-press:#2F9773;
  --sky:#9ED8F0;
  --berry:#F07A9A;
  --bg:#F3E1B4;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Fredoka",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","PingFang SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.col{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,480px);transform:translateX(-50%);pointer-events:none;z-index:2}
button{font:inherit;color:inherit;touch-action:manipulation}
.col *{touch-action:manipulation}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:6px;min-width:0}
.hud-l{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 12px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font-family:var(--f-num);font-size:20px;line-height:1;font-variant-numeric:tabular-nums;box-sizing:border-box;white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.pill.day{font-family:var(--f-display);font-size:17px;letter-spacing:.04em;padding:0 11px}
.pill.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.13)}}
.clock{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 6px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);box-sizing:border-box}
.clock svg{width:22px;height:22px;flex:none}
.clock-bar{flex:1;min-width:24px;height:10px;border-radius:99px;background:var(--well);border:2px solid var(--ink);overflow:hidden;box-sizing:border-box}
.clock-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8FD3FF,#FFC433 60%,#F2674B);transform-origin:left center;transform:scaleX(0)}
.clock span{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.icon-btn{pointer-events:auto;width:38px;height:38px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;box-sizing:border-box;color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:19px;height:19px}
.icon-btn:focus-visible,.big-btn:focus-visible,.btn:focus-visible,.tabs button:focus-visible,.toggle:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

.combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);display:flex;align-items:baseline;gap:6px;padding:4px 14px 5px;border-radius:999px;background:var(--tomato);color:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}
.combo b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.06em}
.combo span{font-family:var(--f-num);font-size:20px}
.combo.pop{animation:cpop .3s ease-out}
@keyframes cpop{0%{transform:translateX(-50%) scale(.6)}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);margin:0 auto;max-width:360px;box-sizing:border-box;background:var(--ink);color:#fff;font-size:14px;font-weight:700;line-height:1.45;padding:9px 14px;border-radius:14px;text-align:center;pointer-events:none;letter-spacing:.02em;box-shadow:0 4px 0 rgba(61,44,41,.25)}
.hint b{color:var(--butter);font-weight:900}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(61,44,41,.9);color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;pointer-events:none;white-space:nowrap}

/* hub sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;transition:top .34s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;background:var(--paper);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -6px 0 rgba(61,44,41,.18);pointer-events:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:20px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.grab i{display:block;width:42px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:20px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.day-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.day-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-title b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;letter-spacing:.03em}
.rep{appearance:none;font-size:12px;font-weight:900;background:var(--tomato);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.goals .cg svg{width:15px;height:15px}
.stars3 .crown svg{width:54px;height:54px}
.event{font-size:12px;font-weight:700;background:var(--sky);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.goals{display:flex;gap:10px;font-family:var(--f-num);font-size:14px;color:var(--ink-soft);flex-wrap:wrap}
.goals span{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.goals svg{width:13px;height:13px}
.big-btn{appearance:none;-webkit-appearance:none;border:3px solid var(--ink);background:var(--tomato);color:#fff;font-family:var(--f-display);font-size:23px;letter-spacing:.08em;padding:9px 18px 11px;border-radius:18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;white-space:nowrap;text-shadow:0 2px 0 rgba(61,44,41,.35)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink);background:var(--tomato-press)}
.big-btn.wide{width:100%}
.big-btn.mint{background:var(--mint)}
.big-btn.mint:active{background:var(--mint-press)}
.quests{display:flex;gap:6px;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.quests::-webkit-scrollbar{display:none}
.quests .ql{flex:none;align-self:center;font-size:12px;font-weight:900;color:var(--ink-soft);letter-spacing:.06em}
.q{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 5px;white-space:nowrap}
.q i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);background:var(--well);box-sizing:border-box;display:grid;place-items:center;flex:none}
.q b{font-family:var(--f-num);font-weight:600;color:#C9861A}
.q.done{background:#E6F6EE;color:var(--ink-soft)}
.q.done i{background:var(--mint)}
.q.done i::after{content:"";width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.qlist{display:flex;flex-direction:column;gap:6px;text-align:left}
.qlist .q{white-space:normal;border-radius:14px;padding:6px 10px 6px 6px}
.qlist .q span{flex:1}
.qlist .q.news{padding:7px 12px;font-weight:700}
.mast{display:inline-flex;gap:1px;vertical-align:-1px}
.mast svg{width:11px;height:11px}
.tabs{display:flex;gap:4px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-bottom:2.5px solid var(--line)}
.tabs button{position:relative;flex:1;appearance:none;border:0;background:none;padding:9px 0 10px;font-weight:700;font-size:15px;color:var(--ink-soft);cursor:pointer;border-radius:12px 12px 0 0;letter-spacing:.04em}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--well)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-2.5px;height:4px;border-radius:4px;background:var(--tomato)}
.dot{position:absolute;top:6px;right:16%;width:9px;height:9px;border-radius:50%;background:var(--tomato);border:2px solid var(--paper)}

  if (!D.frozen && !D.closing) { D.spawnT -= dt; if (D.spawnT <= 0) { if (queue.length < 3) spawnCustomer(); D.spawnT = arrivalGap(); } }

  // stations
  for (const st of Object.values(stations)) {
    st.shake = Math.max(0, st.shake - dt); st.flash = Math.max(0, st.flash - dt);
    st.slots.forEach((s) => {
      if (s.s === 'cook') { s.t += dt; if (s.t >= s.dur) { s.s = 'ready'; s.t = 0; s.age = 0; sfx.ding(); const p = slotPos(st.id, st.slots.indexOf(s)); burst(p.x, p.y, 'sparkle', 4, '#FFFFFF'); } }
      else if (s.s === 'ready') { s.age += dt; if (!stNoBurn(st.id, st.lv)) { const warm = stWarm(st.id, st.lv); const before = s.t; s.t += dt; if (before < warm - 2.6 && s.t >= warm - 2.6) sfx.warn(); if (s.t >= warm) { s.s = 'burnt'; s.item = 'burnt'; sfx.burn(); const p = slotPos(st.id, st.slots.indexOf(s)); burst(p.x, p.y, 'smoke', 8, '#6F7480'); } } }

    rs.addEventListener('click', () => { if (rs.dataset.armed) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} G = defaultSave(); dispCoins = 0; close(); buildStations(); goHub(); toast('已经重新开始'); } else { rs.dataset.armed = '1'; rs.textContent = '再点一次确认清空'; } });
    card.appendChild(rs);
    const b = el('button', 'big-btn wide', '好了'); b.type = 'button'; b.addEventListener('click', close); card.appendChild(b);
    card.appendChild(el('p', '', '奶鼠奶酪屋 · by hyc'));
  });
}
function showPause() {
  paused = true;
  showModal((card, close) => {
    card.appendChild(el('h2', '', '休息一下'));
    card.appendChild(el('p', '', '营业时间暂停中，客人们也会等你。'));
    const qs = G.quests && G.quests.day === G.day ? G.quests.list : [];
    if (qs.length) { const ql = el('div', 'qlist', qs.map(questChip).join('')); card.appendChild(ql); }
    const b = el('button', 'big-btn wide', '继续营业'); b.type = 'button'; b.addEventListener('click', close); card.appendChild(b);
    const mk = (label, key, on) => { const t = el('button', 'toggle', '<span>' + label + '</span><i></i>'); t.type = 'button'; t.setAttribute('aria-pressed', String(G.set[key])); t.addEventListener('click', () => { G.set[key] = !G.set[key]; t.setAttribute('aria-pressed', String(G.set[key])); save(); on && on(G.set[key]); }); return t; };
    card.appendChild(mk('背景音乐', 'music', (v) => { if (v) Music.start(); else Music.stop(); }));
    card.appendChild(mk('音效', 'sfx'));
    const q = el('button', 'btn ghost', '提前打烊（按现在的收入结算）'); q.type = 'button'; q.addEventListener('click', () => { close(); paused = false; if (D) { customers = []; queue = []; endDay(true); } }); card.appendChild(q);
  }, () => { paused = false; if (G.set.music) Music.start(); });
}
function welcome(since) {
  const now = Date.now(), today = new Date().toDateString();
  if (G.loginDay !== today) {
    const y = new Date(now - 86400000).toDateString();
    G.streak = G.loginDay === y ? G.streak + 1 : 1; G.loginDay = today;
    const reward = 40 + 30 * Math.min(G.streak, 7);
    if (G.day > 1 || G.tut) {
      showModal((card, close) => {
        card.appendChild(el('h2', '', '早上好！'));
        card.appendChild(el('p', '', '连续来店第 ' + G.streak + ' 天，奶鼠给你准备了开店红包。'));
        card.appendChild(el('div', 'big-num', SVG_COIN + reward));
        const b = el('button', 'big-btn wide mint', '收下'); b.type = 'button'; b.addEventListener('click', () => { G.coins += reward; dispCoins = G.coins; save(); sfx.buy(); close(); renderHub(); }); card.appendChild(b);
      });
    }
  }
  if (since && G.lastEarn > 0) {
    const mins = Math.min(480, (now - since) / 60000);
    if (mins >= 10) {
      const off = Math.floor(mins / 60 * G.lastEarn * 0.15);
      if (off > 0) showModal((card, close) => {
        card.appendChild(el('h2', '', '外卖订单'));
        card.appendChild(el('p', '', '你不在的 ' + (mins >= 60 ? Math.floor(mins / 60) + ' 小时' : Math.floor(mins) + ' 分钟') + '里，熟客们点了外卖。'));
        card.appendChild(el('div', 'big-num', SVG_COIN + off));
        const b = el('button', 'big-btn wide mint', '收下'); b.type = 'button'; b.addEventListener('click', () => { G.coins += off; dispCoins = G.coins; save(); sfx.buy(); close(); renderHub(); }); card.appendChild(b);
      });
    }
  }
  save();
}

/* =========================================================
   wiring
   ========================================================= */
cv.addEventListener('pointerdown', (e) => { const x = e.clientX - OX, y = e.clientY; handleTap(x, y); });
$('#openBtn').addEventListener('click', () => { ensureAudio(); startDay(); });
$('#setBtn').addEventListener('click', () => { ensureAudio(); showSettings(); });
$('#hubRep').addEventListener('click', () => { ensureAudio(); sfx.tap(); showRepInfo(); });
$('#pauseBtn').addEventListener('click', () => { if (mode === 'day' && !paused) showPause(); });
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => { const same = curTab === b.dataset.tab; curTab = b.dataset.tab; sheetUp = curTab === 'decor' ? false : (same ? !sheetUp : true); placeSheet(); sfx.tap(); renderHub(); }));
$('#grab').addEventListener('click', () => { sheetUp = !sheetUp; placeSheet(); sfx.tap(); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (!document.hidden && mode === 'hub' && hiddenAt && Date.now() - hiddenAt > 600000 && !modalQ.length) welcome(hiddenAt); if (document.hidden) { hiddenAt = Date.now(); Music.stop(); if (mode === 'day' && !paused) showPause(); save(); } else if (G.set.music && (mode === 'hub' || (mode === 'day' && !paused))) Music.start(); });
window.addEventListener('resize', () => { layout(); });
window.addEventListener('pointerdown', () => { ensureAudio(); if (G.set.music && !Music.playing && (mode === 'day' || mode === 'hub')) Music.start(); }, { once: true });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const t0 = TEST ? performance.now() : 0;
  if (!paused) update(dt);
  updateHud();
  render();
  if (TEST) { PERF.push(performance.now() - t0); if (PERF.length > 240) PERF.shift(); }
  requestAnimationFrame(frame);
}
const PERF = [];

loadSave();
const bootSeen = G.lastSeen;
dispCoins = G.coins;
layout();
buildStations();
goHub();
if (G.seasonNew) showSeasonNews();
welcome(bootSeen);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('18px "ZCOOL KuaiLe"', '奶鼠奶酪屋快跑完美哼美食家好评'), document.fonts.load('12px Fredoka', '0123456789')]).then(() => { bgDirty = true; iconCache.clear(); }).catch(() => {});

/* =========================================================
   test hooks: auto-player + fast simulation
   ========================================================= */
function botTick(dt) {
  const B = window.__bot; B.cd -= dt; if (B.cd > 0) return; B.cd = B.react * (B.jitter ? rnd(0.7, 1.3) : 1);
  if (hand) { const tp = toppingNeeded(hand.item); if (tp) return tapJar(tp); if (needCustomer(hand.item)) return tapHand(); return tapTrash(); }
  for (const id of GRID) { const st = stations[id]; if (!st) continue; const ri = st.slots.findIndex((sl) => sl.s === 'ready'); if (ri >= 0) { const it = st.slots[ri].item; if (needCustomer(it) || toppingNeeded(it)) return tapStation(id); } }
  for (let i = 0; i < tray.length; i++) { const it = tray[i]; if (it && it !== '__in' && (needCustomer(it) || toppingNeeded(it))) return tapTray(i); }
  for (const id of GRID) { const st = stations[id]; if (st && st.slots.some((sl) => sl.s === 'burnt')) return tapStation(id); }
  const { want, have } = stockSummary();
  const tm = (b) => STATIONS[GRID.find((k) => STATIONS[k].makes === b)].time;
  const order = Object.keys(want).sort((a, b) => tm(b) - tm(a));
  for (const b of order) { if ((have[b] || 0) >= want[b]) continue; const id = GRID.find((k) => STATIONS[k].makes === b); const st = stations[id]; if (st && st.slots.some((sl) => sl.s === 'idle')) return tapStation(id); }
  // tidy: a full tray of things nobody wants
  if (tray.every((it) => it)) { const i = tray.findIndex((it) => it !== '__in' && !needCustomer(it) && !toppingNeeded(it)); if (i >= 0) return tapTray(i); }
}
if (TEST) {
  window.__bot = { on: false, react: 0.5, cd: 0 };
  window.__shop = {
    G: () => G, D: () => D,
    start() { $('#modal').hidden = true; modalQ = []; startDay(); },
    bot(on, react) { window.__bot.on = !!on; if (react) window.__bot.react = react; },
    skipTut() { G.tut = 1; G.tutTop = 1; save(); },
    reset() { G = defaultSave(); G.tut = 1; G.tutTop = 1; dispCoins = 0; buildStations(); save(); },
    give(n) { G.coins += n; dispCoins = G.coins; renderHub(); },
    setDay(d) { G.day = d; renderHub(); },
    simDays(n, react, buy) {
      SIM = true; const log = []; window.__bot.on = true; window.__bot.react = react || 0.5;
      for (let d = 0; d < n; d++) {
        modalQ = []; $('#modal').hidden = true; startDay();
        let guard = 0; while (mode === 'day' && guard++ < 60 * 400) update(1 / 30);
        const gl = D.gl;
        log.push({ day: G.day - 1, earn: G.lastEarn, goals: gl, stars: G.stars[G.day - 1], total: totalStars(), coins: G.coins, unlocked: G.unlocked.length, served: G.st.served, angry: G.st.angry, extra: 'R' + G.rep + (D.crown ? '👑' : '') + ' ' + (D.event || '-') + ' s' + D.served + ' a' + D.angry + ' m' + D.missed + ' c' + D.bestCombo + ' ch' + charm() + ' up' + JSON.stringify(G.up).replace(/["{}a-z:]/g, '') + ' lv' + Object.values(G.lv).join('') });
        if (buy !== false) autoBuy();
      }
      SIM = false; window.__bot.on = false; goHub(); return log;
    },
    tap(x, y) { handleTap(x, y); },
    perf() { const a = PERF.slice().sort((x, y) => x - y); return { n: a.length, avg: a.reduce((x, y) => x + y, 0) / a.length, p95: a[Math.floor(a.length * 0.95)] }; },
    spawn(sp, items) { const c = spawnCustomer(sp, items.map((id) => ({ id, done: false, fly: false }))); return !!c; },
    set(fn) { fn(G); computeSpots(); buildStations(); bgDirty = true; if (mode === 'hub') renderHub(); },
    pauseSpawns() { if (D) D.spawnT = 9999; },
    hub() { modalQ = []; $('#modal').hidden = true; window.__bot.on = false; goHub(); },
    hold() { if (D) D.frozen = true; },
    layout: () => LY
  };
  function autoBuy() {
    const ts = totalStars();
    for (const u of UNLOCKS) if (!isUnlocked(u.id) && ts >= u.stars && G.coins >= u.cost) { G.coins -= u.cost; G.unlocked.push(u.id); G.lv[u.id] = 1; }
    let bought = true;
    while (bought) {
      bought = false;
      const opts = [];
      GRID.filter((id) => isUnlocked(id)).forEach((id) => { const lv = G.lv[id] || 1; if (lv < MAX_LV) opts.push([Math.round(STATIONS[id].up * ST_COST[lv - 1]), () => { G.lv[id] = lv + 1; }]); });
      Object.keys(GUP).forEach((k) => { const u = GUP[k], l = G.up[k]; if (l < u.costs.length && (!u.stars || ts >= u.stars)) opts.push([u.costs[l], () => { G.up[k] = l + 1; }]); });
      const nextU = UNLOCKS.find((u) => !isUnlocked(u.id));
      const reserve = nextU && ts + 3 >= nextU.stars ? nextU.cost : 0;
      opts.sort((a, b) => a[0] - b[0]);
      if (opts.length && G.coins - opts[0][0] >= reserve) { G.coins -= opts[0][0]; opts[0][1](); bought = true; }
    }
    for (const cat of Object.keys(DECOR)) { const it = DECOR[cat].items.find((x) => !G.owned.includes(cat + ':' + x[0])); if (it && G.coins > it[3] * 3) { G.coins -= it[3]; G.owned.push(cat + ':' + it[0]); G.eq[cat] = it[0]; } }
    computeSpots(); buildStations(); save();
  }
}

} catch (err) {
  const e = document.getElementById('loadErr'); if (e) { e.hidden = false; e.textContent = '游戏出错了：' + (err && err.message ? err.message : err); }
  throw err;
}
})();
