/* Layout: a phone-width game column centred on any screen; canvas shop scene fills it (room above, counter, kitchen grid below); DOM HUD on top, a bottom sheet hub between days, modal cards for results */
:root{
  --ink:#3D2C29;
  --ink-soft:#7B6157;
  --paper:#FFF8EA;
  --card:#FFFDF8;
  --line:#EBD9BD;
  --well:#F6EBD6;
  --butter:#F6D85A;
  --cheese:#FFC433;
  --tomato:#F2674B;
  --tomato-press:#D9533A;
  --mint:#3FB28A;
  --mint-press:#2F9773;
  --sky:#9ED8F0;
  --berry:#F07A9A;
  --bg:#F3E1B4;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Fredoka",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","PingFang SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.col{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,480px);transform:translateX(-50%);pointer-events:none;z-index:2}
button{font:inherit;color:inherit;touch-action:manipulation}
.col *{touch-action:manipulation}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:6px;min-width:0}
.hud-l{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 12px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font-family:var(--f-num);font-size:20px;line-height:1;font-variant-numeric:tabular-nums;box-sizing:border-box;white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.pill.day{font-family:var(--f-display);font-size:17px;letter-spacing:.04em;padding:0 11px}
.pill.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.13)}}
.clock{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 6px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);box-sizing:border-box}
.clock svg{width:22px;height:22px;flex:none}
.clock-bar{flex:1;min-width:24px;height:10px;border-radius:99px;background:var(--well);border:2px solid var(--ink);overflow:hidden;box-sizing:border-box}
.clock-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8FD3FF,#FFC433 60%,#F2674B);transform-origin:left center;transform:scaleX(0)}
.clock span{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.icon-btn{pointer-events:auto;width:38px;height:38px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;box-sizing:border-box;color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:19px;height:19px}
.icon-btn:focus-visible,.big-btn:focus-visible,.btn:focus-visible,.tabs button:focus-visible,.toggle:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

.combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);display:flex;align-items:baseline;gap:6px;padding:4px 14px 5px;border-radius:999px;background:var(--tomato);color:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}
.combo b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.06em}
.combo span{font-family:var(--f-num);font-size:20px}
.combo.pop{animation:cpop .3s ease-out}
@keyframes cpop{0%{transform:translateX(-50%) scale(.6)}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
.hint{z-index:7;position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);margin:0 auto;max-width:360px;box-sizing:border-box;background:var(--ink);color:#fff;font-size:14px;font-weight:700;line-height:1.45;padding:9px 14px;border-radius:14px;text-align:center;pointer-events:none;letter-spacing:.02em;box-shadow:0 4px 0 rgba(61,44,41,.25)}
.hint b{color:var(--butter);font-weight:900}
.toast{z-index:8;position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(61,44,41,.9);color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;pointer-events:none;white-space:nowrap}

/* hub sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;transition:top .34s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;background:var(--paper);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -6px 0 rgba(61,44,41,.18);pointer-events:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:20px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.grab i{display:block;width:42px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:20px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.day-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.day-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-title b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;letter-spacing:.03em}
.rep{appearance:none;font-size:12px;font-weight:900;background:var(--tomato);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.goals .cg svg{width:15px;height:15px}
.stars3 .crown svg{width:54px;height:54px}
.event{font-size:12px;font-weight:700;background:var(--sky);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.goals{display:flex;gap:10px;font-family:var(--f-num);font-size:14px;color:var(--ink-soft);flex-wrap:wrap}
.goals span{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.goals svg{width:13px;height:13px}
.big-btn{appearance:none;-webkit-appearance:none;border:3px solid var(--ink);background:var(--tomato);color:#fff;font-family:var(--f-display);font-size:23px;letter-spacing:.08em;padding:9px 18px 11px;border-radius:18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;white-space:nowrap;text-shadow:0 2px 0 rgba(61,44,41,.35)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink);background:var(--tomato-press)}
.big-btn.wide{width:100%}
.big-btn.mint{background:var(--mint)}
.big-btn.mint:active{background:var(--mint-press)}
.sheet-head,.tabs{flex:none}
.quests{flex:none;display:flex;gap:6px;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.quests::-webkit-scrollbar{display:none}
.quests .ql{flex:none;align-self:center;font-size:12px;font-weight:900;color:var(--ink-soft);letter-spacing:.06em}
.q{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 5px;white-space:nowrap}
.q i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);background:var(--well);box-sizing:border-box;display:grid;place-items:center;flex:none}
.q b{font-family:var(--f-num);font-weight:600;color:#C9861A}
.q.done{background:#E6F6EE;color:var(--ink-soft)}
.q.done i{background:var(--mint)}
.q.done i::after{content:"";width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.qlist{display:flex;flex-direction:column;gap:6px;text-align:left}
.qlist .q{white-space:normal;border-radius:14px;padding:6px 10px 6px 6px}
.qlist .q span{flex:1}
.qlist .q.news{padding:7px 12px;font-weight:700}
.mast{display:inline-flex;gap:1px;vertical-align:-1px}
.mast svg{width:11px;height:11px}
.tabs{display:flex;gap:4px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-bottom:2.5px solid var(--line)}
.tabs button{position:relative;flex:1;appearance:none;border:0;background:none;padding:9px 0 10px;font-weight:700;font-size:15px;color:var(--ink-soft);cursor:pointer;border-radius:12px 12px 0 0;letter-spacing:.04em}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--well)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-2.5px;height:4px;border-radius:4px;background:var(--tomato)}
.dot{position:absolute;top:6px;right:16%;width:9px;height:9px;border-radius:50%;background:var(--tomato);border:2px solid var(--paper)}
.tab-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.sec{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.1em;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:10px 10px 10px 8px;box-shadow:0 3px 0 rgba(61,44,41,.18)}
.row.owned{background:#F2FAF5}
.row.locked{opacity:.62}
.thumb{width:56px;height:56px;flex:none;border-radius:14px;background:var(--well);display:grid;place-items:center;overflow:hidden}
.thumb canvas{width:56px;height:56px;display:block}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.info b{font-size:15px;font-weight:900;letter-spacing:.02em}

.info .meta{display:flex;gap:8px;font-family:var(--f-num);font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.lv{display:inline-flex;gap:3px;margin-top:2px}
.lv i{width:9px;height:9px;border-radius:3px;background:var(--well);border:1.5px solid var(--ink)}
.lv i.on{background:var(--cheese)}
.btn{appearance:none;flex:none;min-width:74px;display:inline-flex;align-items:center;justify-content:center;gap:3px;border:2.5px solid var(--ink);background:var(--cheese);font-family:var(--f-num);font-size:16px;padding:7px 10px;border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:var(--well);color:var(--ink-soft);box-shadow:0 3px 0 rgba(61,44,41,.25);border-color:rgba(61,44,41,.5);cursor:default;transform:none}
.btn.ghost{background:var(--card);font-family:var(--f-body);font-weight:700;font-size:14px}
.btn.mint{background:var(--mint);color:#fff}
.tag{font-size:12px;font-weight:700;color:var(--mint);white-space:nowrap}
.grid-album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.acard{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.acard canvas{width:72px;height:72px}
.acard b{font-size:13px;font-weight:900}
.acard small{font-size:11px;color:var(--ink-soft);line-height:1.35}
.acard.vip{background:#FFF6D6}
.bar{height:8px;border-radius:9px;background:var(--well);border:1.5px solid var(--ink);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--mint)}
.note{margin:2px 0 0;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.5}

/* modal */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(61,44,41,.42);pointer-events:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{width:100%;max-width:360px;max-height:100%;overflow:auto;box-sizing:border-box;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:cardIn .32s cubic-bezier(.2,1.5,.5,1)}
@keyframes cardIn{from{transform:scale(.7);opacity:0}}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:.04em;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-soft)}
.stars3{display:flex;justify-content:center;gap:6px;margin:2px 0}
.stars3 svg{width:58px;height:58px}
.stars3 span:nth-child(2) svg{transform:translateY(-10px);width:66px;height:66px}
.stars3 .s-on{animation:starIn .45s cubic-bezier(.2,1.6,.5,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}}
.big-num{font-family:var(--f-num);font-size:46px;line-height:1;color:var(--tomato);display:flex;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.big-num svg{width:34px;height:34px}
.goalbar{position:relative;height:12px;border-radius:8px;background:var(--well);border:2px solid var(--ink);margin:4px 12px 10px}
.goalbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cheese);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.3,1)}
.goalbar span{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:22px}
.goalbar svg{width:22px;height:22px;display:block}
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:14px}
.ledger span:nth-child(even){font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.ledger .tot{font-weight:900;border-top:2px dashed var(--line);padding-top:6px}
.btns{display:flex;gap:10px}
.btns > *{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:700;cursor:pointer;appearance:none;width:100%;font-size:15px}
.toggle i{width:46px;height:26px;border-radius:99px;background:var(--well);border:2.5px solid var(--ink);position:relative;flex:none;box-sizing:border-box}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--mint)}
.toggle[aria-pressed="true"] i::after{transform:translateX(20px);background:#fff}
.unlock-art canvas{width:110px;height:110px}
.code{width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);resize:none;word-break:break-all;-webkit-user-select:text;user-select:text}
.hud.inday .pill.day{font-size:15px;padding:0 9px}
.hud.inday #coinPill{font-size:18px;padding:0 10px}
.hud.inday .clock span{font-size:13px}
#coinPill.long{font-size:17px;padding:0 10px}
.swap{position:absolute;top:-46px;left:max(12px,env(safe-area-inset-left,0px));appearance:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:17px;background:var(--mint);color:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 12px 6px 9px;cursor:pointer;white-space:nowrap;letter-spacing:.06em;box-shadow:0 3px 0 var(--ink);text-shadow:0 1px 0 rgba(61,44,41,.3)}
.swap svg{width:22px;height:22px;flex:none}
.swap.back{background:var(--butter);color:var(--ink);text-shadow:none}
.swap:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.goals .gl{font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--ink-soft)}
.ptag{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;padding:3px 5px;border-radius:6px;background:var(--well);color:var(--ink-soft);margin-left:5px;vertical-align:2px;letter-spacing:0}
.ptag.fresh{background:#E6F6EE;color:#2F9773}
.ptag.cold{background:#E3F2FB;color:#3F6FAE}
.ptag.deal{background:#FFE9E3;color:#D9533A}
.priceline{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:3px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{appearance:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-family:var(--f-num);font-size:17px;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.stepper button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.stepper b{min-width:36px;text-align:center;font-family:var(--f-num);font-weight:600;font-size:15px}
.stepper em{font-style:normal;font-size:12px;font-weight:900;min-width:28px}
.row.dim{background:#FBF7EF}
.row.dim .thumb{opacity:.75}
.tiers{display:flex;gap:6px;margin-top:5px}
.unithead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.unithead .btn.sm{font-size:12px;padding:3px 8px}
.tierbtn{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:12px;background:var(--well);padding:4px 6px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 rgba(61,44,41,.25)}
.tierbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tierbtn canvas{width:22px;height:22px;flex:none}
.acts{display:flex;gap:6px;margin-top:5px;align-items:center}
.btn.sm{min-width:0;font-size:13px;padding:5px 9px}
.btn.tall{flex-direction:column;line-height:1.15;font-size:15px;padding:4px 8px 5px;min-width:70px;gap:1px}

.acard.pick{appearance:none;cursor:pointer;font:inherit;color:inherit}

.stockbar{display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:10px 10px 10px 14px}

.festchip svg{width:15px;height:15px}
.btn.candy{background:#FFE3C4}
.big-num.candy{color:#E07A1F}
.hearts{display:inline-flex;gap:1px;vertical-align:-2px}
.hearts svg{width:13px;height:13px}
.hearts.big svg{width:24px;height:24px}
.storyhearts{margin-top:-4px}
.card p.story{color:var(--ink);font-size:15px;line-height:1.7;text-align:left;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.card p.gift{color:#D9533A;font-weight:900}
.storyline{appearance:none;cursor:pointer;font:inherit;text-align:left;color:inherit}
.storyline.locked{opacity:.55;cursor:default}
.regift{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-soft)}
.regift canvas{width:56px;height:56px;border-radius:12px}
.regs .acard small{min-height:1.4em}
.skins .acard small{min-height:2.7em}
.skins .acard small svg{width:12px;height:12px;vertical-align:-1px}
.wardrobe .thumb canvas{width:56px;height:56px}
.openwrap{display:flex;flex-direction:column;gap:8px;align-items:stretch;flex:none}
.pzbtn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:2.5px solid var(--ink);background:#24398F;color:#fff;font-family:var(--f-display);font-size:15px;letter-spacing:.06em;padding:4px 10px 5px;border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.pzbtn svg{width:20px;height:20px;flex:none}
.pzbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pz{position:fixed;inset:0;z-index:40;background:#16205A}
.pz canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pzx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));z-index:2}
.pztitle{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(14px,env(safe-area-inset-right,0px));font-family:var(--f-display);color:rgba(255,255,255,.8);font-size:16px;letter-spacing:.08em;pointer-events:none}
.swaps{position:absolute;top:-46px;left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;pointer-events:none}
.swaps .swap{position:static;pointer-events:auto}
.swap.farm{background:#7CC36A}
.farm-on #hud,.farm-on #hub{display:none!important}
.farm{position:fixed;inset:0;z-index:1;background:#86C55A}

function mQuests() {
  if (M.quests && M.quests.day === M.day) return M.quests.list;
  const list = [], n = M.day < 2 ? 0 : M.day < 8 ? 2 : 3, sh = shelved();
  const est = 130 / (Math.max(2.4, 3.5 - 0.03 * (M.day - 1)) / ((1 + 0.12 * M.up.ads) * mRepArrive()));
  const rw = Math.max(40, Math.round(mGoals(M.day)[2] * 0.15 / 10) * 10);
  const types = [['sell', 3], ['serve', 2], ['cash', 1.4], ['calm', 0.8], ['fast', 1.2]];
  if (M.day >= 5) types.push(['thief', 0.4]);
  while (list.length < n) {
    const left = types.filter(([k]) => !list.some((q) => q.t === k)); if (!left.length) break;
    const t = wpick(left); let q;
    if (t === 'sell') { if (!sh.length) continue; q = { t, prod: pick(sh), n: clamp(Math.round(est * 2.4 / sh.length * 0.85), 4, 40) }; }
    else if (t === 'serve') q = { t, n: clamp(Math.round(est * 0.72), 10, 60) };
    else if (t === 'cash') q = { t, n: clamp(Math.round(est * M_CASH[M.up.pay] * 0.55), 4, 30) };
    else if (t === 'fast') q = { t, n: clamp(Math.round(est * 0.35), 4, 30) };
    else if (t === 'thief') q = { t, n: 1 };
    else q = { t, n: 1 };
    q.p = 0; q.done = false; q.r = t === 'calm' ? Math.round(rw * 1.5 / 10) * 10 : rw;
    list.push(q);
  }
  M.quests = { day: M.day, list }; save();
  return list;
}
function mQuestText(q) {
  if (q.t === 'sell') return '卖出 ' + q.n + ' 件' + PRODUCTS[q.prod].name;
  if (q.t === 'serve') return '结账 ' + q.n + ' 位顾客';
  if (q.t === 'cash') return '现金找零 ' + q.n + ' 次';
  if (q.t === 'fast') return '神速结账 ' + q.n + ' 次';
  if (q.t === 'thief') return '赶走偷吃的大灰猫';
  return '一整天没有客人生气';
}
function mQuestEvent(kind, arg, n) {
  if (!MD || !M.quests || M.quests.day !== M.day) return;
  M.quests.list.forEach((q) => {
    if (q.done || q.t !== kind) return;
    if (kind === 'sell' && arg !== q.prod) return;
    q.p += n || 1;
    if (q.p >= q.n) { q.done = true; q.p = q.n; G.coins += q.r; MD.bonus += q.r; MD.questCoins += q.r; dispCoins = G.coins; if (!SIM) setTimeout(() => { toast('委托完成：' + mQuestText(q) + '  +' + q.r); sfx.buy(); }, 400); }
  });
}

function fTap(hit) {
  if (FARM.seed && (!hit || hit.k !== 'plot')) { fSeedClose(); if (!hit) return; }
  if (!hit) return;
  if (hit.k === 'plot') {
    const i = hit.i;
    if (i >= F.plots.length) { if (i === F.plots.length) fAskPlot(); return; }
    const p = F.plots[i];
    if (!p.c) { fSeedOpen(i); return; }
    const R = FL.plots[i]; FARM.tip = { x: R.x + R.w / 2, y: R.y - 8, text: F_CROPS[p.c].name + ' · 还要 ' + fTime(fPlotLeft(p)), t: 1.6 }; sfx.tap();
    return;
  }
  sfx.tap();
  if (hit.k === 'pen') fPenTap(hit.id);
  else if (hit.k === 'mach') fMachTap(hit.id);
  else if (hit.k === 'board') fPanel('orders');
  else if (hit.k === 'barn') fPanel('wh');
  else if (hit.k === 'house') fPanel('me');
  else if (hit.k === 'mouse') fPokeMouse();
  else if (hit.k === 'train') fTrainTap();
  else if (hit.k === 'obs') fObsTap(hit.id);
}
// ---------- pointer ----------
function fPointer(e, kind) {
  if (!FARM) return;
  const x = e.clientX, y = e.clientY, wx = (x - OX) / FL.k, wy = (y + FARM.scroll) / FL.k;
  if (kind === 'down') {
    if (FARM.ptr) return;
    ensureAudio();
    const hit = fHit(wx, wy);
    FARM.ptr = { id: e.pointerId, x0: x, y0: y, ly: y, lt: performance.now(), moved: false, hit, mode: null, vy: 0 };
    FARM.vy = 0;
    if (hit && hit.k === 'plot' && hit.i < F.plots.length) {
      const p = F.plots[hit.i];
      if (fPlotRipe(p)) { FARM.ptr.mode = 'harvest'; fDoHarvest(hit.i); }
      else if (!p.c && FARM.seed) { FARM.ptr.mode = 'plant'; fDoPlant(hit.i); }
    }
    if (e.target.setPointerCapture) try { e.target.setPointerCapture(e.pointerId); } catch (er) {}
  } else if (kind === 'move') {
    const P = FARM.ptr; if (!P || P.id !== e.pointerId) return;
    if (P.mode === 'harvest' || P.mode === 'plant') {
      const h = fHit(wx, wy);
      if (h && h.k === 'plot' && h.i < F.plots.length) { const p = F.plots[h.i]; if (P.mode === 'harvest' && fPlotRipe(p)) fDoHarvest(h.i); else if (P.mode === 'plant' && !p.c) fDoPlant(h.i); }
      return;
    }
    if (P.mode === 'stop') return;
    if (!P.moved && Math.hypot(x - P.x0, y - P.y0) > 8) { P.moved = true; P.mode = 'scroll'; }
    if (P.mode === 'scroll') { const now = performance.now(), dy = y - P.ly, dtm = Math.max(1, now - P.lt); FARM.scroll = clamp(FARM.scroll - dy, 0, fScrollMax()); P.vy = lerp(P.vy, -dy / dtm * 1000, 0.5); P.ly = y; P.lt = now; }
  } else {
    const P = FARM.ptr; if (!P || P.id !== e.pointerId) return;
    FARM.ptr = null;
    if (P.mode === 'scroll') { FARM.vy = performance.now() - P.lt < 90 ? clamp(P.vy, -4000, 4000) : 0; return; }
    if (!P.moved && !P.mode && kind === 'up') fTap(P.hit);
  }
}

        if (opts.mgrIncome === false) G.mgr = 0;
        modalQ = []; $('#modal').hidden = true; mStartDay();
        let guard = 0; while (mode === 'day' && guard++ < 60 * 400) { update(1 / 30); }
        log.push({ day: M.day - 1, profit: MD.profit, sales: MD.sales, cogs: MD.cogsR, waste: MD.waste, stolen: MD.stolenR, goals: MD.gl, stars: M.stars[M.day - 1], tot: mStars(), coins: G.coins, rep: M.rep, served: MD.served, angry: MD.angry, stockouts: MD.stockouts, pricey: MD.pricey, sat: Math.round(MD.sat * 100), units: M.units.filter((u) => u.open).length, prods: M.unlocked.length, spent, ev: MD.event || '-', up: JSON.stringify(M.up).replace(/["{}a-z:]/g, ''), staff: JSON.stringify(M.staff).replace(/["{}a-z:]/g, '') });
      }
      SIM = false; window.__bot.on = false; goHub(); return log;
    }
  };
  function autoBuy() {
    const ts = totalStars();
    for (const u of UNLOCKS) if (!isUnlocked(u.id) && ts >= u.stars && G.coins >= u.cost) { G.coins -= u.cost; G.unlocked.push(u.id); G.lv[u.id] = 1; }
    let bought = true;
    while (bought) {
      bought = false;
      const opts = [];
      GRID.filter((id) => isUnlocked(id)).forEach((id) => { const lv = G.lv[id] || 1; if (lv < MAX_LV) opts.push([Math.round(STATIONS[id].up * ST_COST[lv - 1]), () => { G.lv[id] = lv + 1; }]); });
      Object.keys(GUP).forEach((k) => { const u = GUP[k], l = G.up[k]; if (l < u.costs.length && (!u.stars || ts >= u.stars)) opts.push([u.costs[l], () => { G.up[k] = l + 1; }]); });
      const nextU = UNLOCKS.find((u) => !isUnlocked(u.id));
      const reserve = nextU && ts + 3 >= nextU.stars ? nextU.cost : 0;
      opts.sort((a, b) => a[0] - b[0]);
      if (opts.length && G.coins - opts[0][0] >= reserve) { G.coins -= opts[0][0]; opts[0][1](); bought = true; }
    }
    for (const cat of Object.keys(DECOR)) { const it = DECOR[cat].items.find((x) => !G.owned.includes(cat + ':' + x[0])); if (it && G.coins > it[3] * 3) { G.coins -= it[3]; G.owned.push(cat + ':' + it[0]); G.eq[cat] = it[0]; } }
    computeSpots(); buildStations(); save();
  }
}

} catch (err) {
  const e = document.getElementById('loadErr'); if (e) { e.hidden = false; e.textContent = '游戏出错了：' + (err && err.message ? err.message : err); }
  throw err;
}
})();
